# Builds the single image all services run. A merged code-fix PR rebuilds it,
# which is what closes the loop: fix -> merge -> image -> rollout -> auto-resolve.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QEMU is required for the arm64 half of the build. The cluster is a
      # Raspberry Pi 5; an amd64-only image fails to pull there with
      # "no match for platform in manifest", which is not an obvious message.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
