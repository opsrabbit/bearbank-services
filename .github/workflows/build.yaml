# Builds the single image all services run. A merged code-fix PR rebuilds it,
# which is what closes the loop: fix -> merge -> image -> rollout -> auto-resolve.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QEMU is required for the arm64 half of the build. The cluster is a
      # Raspberry Pi 5; an amd64-only image fails to pull there with
      # "no match for platform in manifest", which is not an obvious message.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # Building the image is not deploying it. This is what closes that gap.
  #
  # The estate is managed by ArgoCD from bear-gitops with the image tag PINNED,
  # so a rollout is a git change rather than something that happens invisibly on
  # the next unrelated pod restart. Bumping that tag is therefore the whole
  # deploy: ArgoCD notices the commit and rolls the Deployments.
  #
  # Before this existed, a merged code fix reached the registry and stopped.
  # Measured 2026-08-30: a fix was pushed on 08-27 and the pods were still on a
  # 29-day-old digest, the defect live in production while the repo showed it
  # fixed. That also breaks the agent's code-fix loop in a way that reads as a
  # model failure: remediation is shown a repo file that no longer contains the
  # bug, so its SEARCH anchor cannot match and no pull request is opened.
  bump-gitops:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # The App, not GITHUB_TOKEN: that token is scoped to THIS repository and
      # cannot write to bear-gitops. The AutoSRE Bot App is already installed on
      # the org and is what opens remediation PRs there, so no new credential is
      # introduced — the token is minted per run and scoped to one repository.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: opsrabbit
          repositories: bear-gitops

      - uses: actions/checkout@v4
        with:
          repository: opsrabbit/bear-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Point the estate at the image this run built
        working-directory: gitops
        env:
          NEW_TAG: ${{ github.sha }}
        # python3, not sed: `sed -i -E` with \s and a backreference behaves
        # differently under BSD and GNU sed, so the same line that works on the
        # runner silently fails when anyone tests it on a Mac.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, pathlib
          kust = pathlib.Path("bearbank/kustomization.yaml")
          new_tag = os.environ["NEW_TAG"]
          updated, count = re.subn(
              r"^(\s*newTag:).*$", rf"\1 {new_tag}", kust.read_text(), flags=re.M)
          # Rewriting nothing is indistinguishable from "already up to date".
          # Fail loudly: silently not deploying is the bug this job removes.
          if count != 1:
              sys.exit(f"::error::expected exactly one newTag:, replaced {count}.")
          kust.write_text(updated)
          print(f"newTag -> {new_tag}")
          PY

      - name: Commit the bump
        working-directory: gitops
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already on ${{ github.sha }} — nothing to commit"
            exit 0
          fi
          git config user.name  "autosre-bot[bot]"
          git config user.email "autosre-bot[bot]@users.noreply.github.com"
          git commit -am "chore(bearbank): roll the estate to ${{ github.sha }}" \
            -m "Built by ${{ github.repository }}@${{ github.sha }}. ArgoCD syncs this commit, which is what actually deploys the change."
          git push
